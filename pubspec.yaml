name: app_update_gate
description: >-
  Source-agnostic force/optional update gate for Flutter. Bring your own
  update policy source (REST API or any backend), guarded by a real
  store-availability check (Play In-App Update on Android, iTunes lookup on
  iOS) so users are never locked out of a build that is not actually live.
version: 0.1.0

environment:
  sdk: ^3.7.2
  flutter: '>=1.20.0'

dependencies:
  flutter:
    sdk: flutter

  # Reads the running app version name and build number.
  package_info_plus: ^10.2.0

  # Opens the store page as a fallback.
  url_launcher: ^6.3.2

  # HTTP policy source + iOS store-availability check (iTunes lookup API).
  http: ^1.6.0

  # Android store-availability check + immediate in-app update.
  in_app_update: ^4.2.5

repository: https://github.com/rachadaccoumeh/app_update_gate

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
